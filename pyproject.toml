[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trickster"
version = "0.3.0"
description = "Ulti AI (base-event bidder + web app) with an isolated Snapszer engine."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["fastapi", "uvicorn", "numpy", "torch"]

[project.optional-dependencies]
dev = ["pytest"]
fast = ["cython"]

# NOTE: multi-root layout finalized in Stage 6 (adds ulti/, ultisolver/, apps/).
# For now only the isolated snapszer `trickster` package is installable.
[tool.setuptools]
package-dir = {"" = "snapszer"}

[tool.setuptools.packages.find]
where = ["snapszer"]

